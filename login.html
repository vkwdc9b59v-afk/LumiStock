<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Iniciar sesión - LumiStock</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .contenedor{
            display: flex;
            width: 90%;
            max-width: 1000px;
            min-height: 520px;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(20, 54, 90, 0.15);
        }

        .panel-izquierdo{
            flex: 1;
        }

        .panel-izquierdo img{
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .panel-derecho{
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel-derecho h1{
            margin: 0 0 8px 0;
            font-size: 34px;
            line-height: 1.15;
            color: #14365a;

        }

        .lumi{
            color: #14365a;
        }

        .stock{
            color: #1fb35a;
        }

        .panel-derecho > p{
            margin: 0 0 28px 0;
            color: #5d6b73;

        }

        form > label{
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #14365a;

        }

        form input[type="text"],
         form input[type="password"] {
         width: 100%;
         box-sizing: border-box;
         padding: 13px 14px;
         margin-bottom: 18px;
         font-size: 16px;
         border: 1.5px solid #c9d2d7;
         border-radius: 8px;
        }

        form input[type="text"]:focus,
        form input[type="password"]:focus{
            outline: none;
            border-color: #1fb35a;
        }

        .opciones{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;

        }

        .opciones a{
            color: #168a45;
            text-decoration: none;
        }

        .opciones a:hover {
            text-decoration: underline;
        }

        form button {
         width: 100%;
         padding: 14px;
         font-size: 16px;
         font-weight: bold;
         color: #ffffff;
         background-color: #14365a;
         border: none;
         border-radius: 8px;
         cursor: pointer;

        }

        form button:hover {
            background-color: #0e2a47;
        }

form button:hover {
    background-color: #0e2a47;
}
        
        .crear{
            display: block;
            margin-top: 14px;
            padding: 13px;
            text-align: center;
            font-weight: bold;
            color: #168a45;
            text-decoration: none;
            border: 2px solid #1fb35a;
            border-radius: 8px;


        }

        .crear:hover{
            background-color: #e8f5ed;

        }
        
    </style>
</head>
<body>

    <div class="contenedor">

        <section class="panel-izquierdo">
            <img src="loginlogo.png" alt="LumiStock: Ubica, Ilumina, Encuentra">
        </section>

        <section class="panel-derecho">
            <h1>Bienvenido a <span class="lumi">Lumi</span><span class="stock">Stock</span></h1>
            <p>Sistema ubicación por iluminación</p>

            <form action="admin.html">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Usuario">

                <label for="clave">Contraseña</label>
                <input type="password" id="clave" placeholder="Contraseña">

                <div class="opciones">
                    <label><input type="checkbox"> Recordar sesión</label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>

            <a href="#" class="crear">Crear una cuenta</a>
        </section>

    </div>

</body>
</html>
